<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After Hours — Teacher Screen</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/host.css">
</head>
<body class="host">
  <div id="conn" class="conn-pill hidden" role="status" aria-live="polite"></div>

  <main id="setup" class="setup">
    <canvas id="setupMap" class="bg-map" aria-hidden="true"></canvas>
    <section class="setup-card">
      <div class="brand"><span class="b1">AFTER</span> <span class="b2">HOURS</span><div class="b3">Night Crew · teacher screen</div></div>
      <div id="resumeBox" class="resume hidden"></div>
      <label class="field">Question pack <select id="packSelect"></select></label>
      <p id="packInfo" class="muted small"></p>
      <div class="row">
        <label class="field">Game length
          <select id="minutes"><option value="5">5 minutes</option><option value="8" selected>8 minutes</option><option value="10">10 minutes</option><option value="12">12 minutes</option></select>
        </label>
      </div>
      <label class="field">Join address for phones (QR code)
        <input id="joinBase" type="url" placeholder="http://192.168.x.x:8787" autocomplete="off">
      </label>
      <p id="lanHint" class="muted small"></p>
      <div class="row">
        <button id="createBtn" class="btn primary big">Create game</button>
        <button id="demoBtn" class="btn big">Try a DEMO (bots)</button>
      </div>
      <p class="muted small">Edit questions in the <a href="editor.html">question editor</a>. Each game keeps its own copy of the pack.</p>
      <p id="setupErr" class="err" role="alert"></p>
    </section>
  </main>

  <main id="game" class="game hidden">
    <header class="topbar">
      <div class="brand mini"><span class="b1">AFTER</span> <span class="b2">HOURS</span></div>
      <span id="demoTag" class="tag demo hidden">DEMO · bots</span>
      <div class="codebox">Code <b id="codeMini"></b></div>
      <div id="bigTimer" class="big-timer">LOBBY</div>
      <div class="ctrls">
        <button id="cStart" class="btn primary">▶ Start</button>
        <button id="cPause" class="btn">⏸ Pause</button>
        <button id="cAdd" class="btn">+1 min</button>
        <button id="cEnd" class="btn">⏹ End</button>
        <button id="cReset" class="btn danger">↺ Reset</button>
        <button id="cMusic" class="btn icon" aria-pressed="true" title="Music">🎵</button>
        <button id="cSfx" class="btn icon" aria-pressed="true" title="Sound effects">🔊</button>
        <button id="cFull" class="btn icon" title="Full screen">⛶</button>
      </div>
    </header>
    <div class="stage">
      <div class="map-wrap">
        <canvas id="map" aria-label="Live school map"></canvas>
        <div id="banner" class="banner hidden"></div>
        <section id="overlay" class="overlay hidden"></section>
      </div>
      <aside class="rail">
        <h2>Crew race</h2>
        <div id="board" class="board"></div>
        <div id="stats" class="statbox"></div>
        <h3>Live feed</h3>
        <ul id="feed" class="feed"></ul>
      </aside>
    </div>
  </main>
  <script type="module" src="js/host.js"></script>
</body>
</html>
