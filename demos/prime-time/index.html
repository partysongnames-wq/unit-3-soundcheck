<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Time — Screen Time</title>
<meta name="description" content="Gateway B1 Unit 5 projector lesson: TV vocabulary, true/false quiz, adjective sort and team game.">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-start">
<a class="skip" href="#stage">Skip to stage</a>

<header class="bar" id="bar">
  <div class="brand" aria-label="Prime Time">
    <span class="onair" aria-hidden="true"><i></i>ON AIR</span>
    <span class="logo">PRIME<b>TIME</b></span>
  </div>
  <nav class="chips" id="chips" aria-label="Running order"></nav>
  <div class="clock">
    <button type="button" class="timer" id="timer" aria-label="Lesson timer. Click to edit minutes">5:00</button>
    <label class="timer-edit" id="timerEdit" hidden>
      <span class="sr">Timer minutes</span>
      <input type="text" id="timerInput" inputmode="decimal" autocomplete="off" size="5">
    </label>
    <button type="button" class="icon-btn" id="timerToggle" aria-label="Start timer" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="gear" aria-label="Teacher settings" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 5-1.9-.3a6.8 6.8 0 0 1-.6 1.5l1.1 1.6-1.8 1.8-1.6-1.1c-.5.3-1 .5-1.5.6l-.3 1.9h-2.6l-.3-1.9c-.5-.1-1-.3-1.5-.6l-1.6 1.1-1.8-1.8 1.1-1.6c-.3-.5-.5-1-.6-1.5l-1.9-.3v-2.6l1.9-.3c.1-.5.3-1 .6-1.5L5.6 7.9l1.8-1.8 1.6 1.1c.5-.3 1-.5 1.5-.6l.3-1.9h2.6l.3 1.9c.5.1 1 .3 1.5.6l1.6-1.1 1.8 1.8-1.1 1.6c.3.5.5 1 .6 1.5l1.9.3z"/></svg>
    </button>
  </div>
</header>

<main id="stage" class="stage" tabindex="-1" aria-live="polite"></main>

<footer class="foot" id="foot">
  <p class="caption" id="caption"></p>
  <div class="nav">
    <button type="button" class="nav-btn" id="prev" aria-label="Back">&larr;</button>
    <span class="count" id="count" aria-hidden="true"></span>
    <button type="button" class="nav-btn nav-next" id="next" aria-label="Next">Next &rarr;</button>
  </div>
</footer>

<aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle" hidden>
  <div class="panel-head">
    <h2 id="panelTitle">Teacher settings</h2>
    <button type="button" class="icon-btn" id="panelClose" aria-label="Close teacher settings">&times;</button>
  </div>
  <label class="row"><input type="checkbox" id="optSound"> Sound effects</label>
  <label class="row"><input type="checkbox" id="optMotion"> Reduce motion</label>
  <label class="row">Class size (pair picker)
    <input type="number" id="optClass" min="2" max="60" value="40">
  </label>
  <div class="row btns">
    <button type="button" class="btn ghost" id="resetScores">Reset team scores</button>
    <button type="button" class="btn ghost" id="resetPoll">Reset poll</button>
    <button type="button" class="btn ghost" id="resetPairs">Reset pair picker</button>
  </div>
  <h3>Keys</h3>
  <dl class="keys">
    <dt>Space / &rarr;</dt><dd>Next reveal / next slide</dd>
    <dt>&larr;</dt><dd>Back</dd>
    <dt>0–6</dt><dd>Jump to E0–E6</dd>
    <dt>1 / 2 / 3</dt><dd>Ex 3: move selected word</dd>
    <dt>T</dt><dd>Start / pause timer</dd>
    <dt>F</dt><dd>Fullscreen</dd>
    <dt>S</dt><dd>This panel</dd>
  </dl>
  <p class="note">Nothing is saved. Team scores and poll counts live only in this tab.</p>
</aside>

<div class="static" id="static" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
